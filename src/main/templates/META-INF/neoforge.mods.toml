modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="spectral_enchantments.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional: Spectral Weapon reads Better Combat's attack combos (which also describe Simply Swords' weapons).
[[dependencies."${mod_id}"]]
modId="bettercombat"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"

# Optional: Ars Nouveau's Dispel frees a possessed weapon (Curse of Possession).
[[dependencies."${mod_id}"]]
modId="ars_nouveau"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"
