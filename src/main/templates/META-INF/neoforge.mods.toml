modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# The two-handed arm pose of studying and copying enchantments at a lectern.
enumExtensions="META-INF/enumextensions.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="spectral_enchantments.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional: Animated reads Better Combat's attack combos (which also describe Simply Swords' weapons).
[[dependencies."${mod_id}"]]
modId="bettercombat"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"

# Optional: Ars Nouveau's Dispel frees a possessed weapon (Curse of Possession).
[[dependencies."${mod_id}"]]
modId="ars_nouveau"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"

# Optional: Configured gives the configs an in-game screen (Mods > Spectral Enchantments > Config).
[[dependencies."${mod_id}"]]
modId="configured"
type="optional"
versionRange="*"
ordering="NONE"
side="CLIENT"

# Configured: the background behind this mod's config screens.
[modproperties."${mod_id}"]
configuredBackground="minecraft:textures/block/amethyst_block.png"
