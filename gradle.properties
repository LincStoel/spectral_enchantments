mod_authors=Linc Stoel
mod_description=A collection of enchantments with spectral flair: Broad Breaker (mine a wide area, aided by spectral copies of your tool), Far Miner (a spectral tool mines blocks beyond your reach), Gather (drops go straight to your inventory), Branch Finding (outline the logs hidden in a canopy), Animated (your weapon fights beside you from your hotbar, or flies off to guard a spot), Catapulting (your bow fires whatever is in your off hand), Explosive Bolts (your crossbow fires fire charges, blaze rods, ghast tears, water bottles and potions), Doppelganger (sneak to leave a ghostly double behind that monsters attack instead of you), the Curse of Possession (the weapon turns on whoever picks it up) and the Curse of Haunting (a ghost of you stares from afar and strengthens nearby monsters). Curses also stay hidden until an item reaches your inventory, and briefly bind themselves to you when they do.
