mod_description=A collection of enchantments with spectral flair: Broad Breaker (mine a wide area, aided by spectral copies of your tool), Spectral Weapon (your weapon fights beside you), Far Miner (a spectral tool mines blocks beyond your reach), Gather (drops go straight to your inventory), Branch Finding (outline the logs hidden in a canopy), Animated (your weapon flies off to fight on its own), Catapulting (your bow fires whatever is in your off hand) and Explosive Bolts (your crossbow fires fire charges, blaze rods and ghast tears).
